<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay — one AV kit, every club booking</title>
    <meta
      name="description"
      content="Relay moves one shared camera, mic, tripod and light kit through back-to-back college club slots, with a mandatory 15-minute inspection between every handoff."
    />
    <meta name="color-scheme" content="dark light" />
    <!-- No-flash theme: resolve the stored or system theme before first paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("relay-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
